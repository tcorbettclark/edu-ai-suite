# edu-ai-suite packaging.
#
# A teaching library in plain Python: interpretable image features, tiny Keras
# language models, and MLX LoRA fine-tuning.
#
# Dependency floors are the versions used for development. The MLX extra is
# pinned exactly: the tuner internals are less stable than Keras's fit.

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "edu-ai-suite"
version = "0.0.1"
description = "Teaching material for image features, tiny language models and LoRA fine-tuning: plain Python, no GUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"

# Base: what the package itself imports. huggingface-hub is here because the
# asset downloader names it directly; datasets only happens to pull it in.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python-headless>=4.12,<5",
    "datasets>=5.1",
    "huggingface-hub>=0.29",
    "keras>=3.10.0",
    "tensorflow>=2.19.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# Only LoRA is optional: MLX is Apple-silicon-only, so it cannot be a hard
# requirement.
lora = [
    'mlx-lm[train]==0.32.2; platform_machine == "arm64" and sys_platform == "darwin"',
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pillow>=10",
]

[project.scripts]
assets = "edu_ai_suite.assets.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["edu_ai_suite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = [
    "slow: end-to-end runs needing converted-model loads (run with '-m slow')",
]
filterwarnings = [
    "ignore::DeprecationWarning:keras.*",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF003", "RUF005"]

[tool.ruff.lint.isort]
known-first-party = ["edu_ai_suite", "synth"]
